name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --target wasm32-unknown-unknown
      - name: Fixture crate stays independent of the crates under test
        run: '! grep -nE "^\s*brushkit-(abr|preview)\s*=" crates/fixture/Cargo.toml'
