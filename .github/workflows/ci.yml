name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps --document-private-items
        env: { RUSTDOCFLAGS: -D warnings }
      - run: cargo test --workspace
      - name: The JPEG decoder and image share one zune-jpeg
        run: cargo tree --invert zune-jpeg --depth 0
      - name: The PNG decoder and image share one png
        run: cargo tree --invert png --depth 0
      - name: Only the tests enable image's JPEG decoder
        run: test "$(cargo tree -e no-dev --workspace -i image -f '{f}' --depth 0 --all-features --target all)" = png
      - run: cargo test -p brushkit --no-default-features
      - run: cargo build --workspace --target wasm32-unknown-unknown
      - name: Fixture crate stays independent of the crates under test
        run: '! grep -nE "^\s*brushkit-(abr|preview)\s*=" crates/fixture/Cargo.toml'
  test-wasip1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: wasmtime@49.0.0 }
      - run: cargo test --workspace --target wasm32-wasip1 --no-fail-fast -- --no-capture
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [abr_parse, preview_abr, preview_brush, preview_brushset]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Replay committed corpus
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -runs=0 -timeout=10 -rss_limit_mb=2048 -max_len=1048576
      - name: Fuzz for 30 seconds
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=30 -timeout=10 -rss_limit_mb=2048 -max_len=1048576
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
