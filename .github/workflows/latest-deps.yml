name: Latest dependencies
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
jobs:
  test-latest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo update
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/single-copy
      - run: cargo test --workspace
      - run: cargo build --workspace --target wasm32-unknown-unknown
      - name: The crates build from a consumer crate without a lockfile
        env: { CARGO_TARGET_DIR: "${{ github.workspace }}/target" }
        run: |
          cargo new --lib --vcs none --edition 2021 "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          cargo add --path "$GITHUB_WORKSPACE/crates/brushkit" --features serde
          cargo build
      - name: The tests ran on the versions a consumer resolves
        run: |
          cargo tree -e normal -p brushkit -F brushkit/serde --prefix none --no-dedupe -f '{p}' | sort -u > "$RUNNER_TEMP/workspace.txt"
          cd "$RUNNER_TEMP/consumer"
          cargo tree -e normal --prefix none --no-dedupe -f '{p}' | grep -v '^consumer ' | sort -u > "$RUNNER_TEMP/consumer.txt"
          diff "$RUNNER_TEMP/workspace.txt" "$RUNNER_TEMP/consumer.txt"
      - name: No unpinned dependency resolves below its newest compatible release
        run: |
          cargo metadata --format-version 1 --no-deps | jq -r '.packages[].dependencies[] | select(.kind == null and (.req | test("^[=~<]"))) | .name' | sort -u > "$RUNNER_TEMP/pinned.txt"
          cut -d ' ' -f 1 "$RUNNER_TEMP/consumer.txt" | sort -u > "$RUNNER_TEMP/consumer-names.txt"
          cd "$RUNNER_TEMP/consumer"
          cargo update --dry-run --verbose 2>&1 | tee "$RUNNER_TEMP/update.txt"
          sed -n 's/^ *Unchanged \([^ ]*\) v[^ ]* (available: v.*)$/\1/p' "$RUNNER_TEMP/update.txt" | sort -u > "$RUNNER_TEMP/behind.txt"
          comm -12 "$RUNNER_TEMP/behind.txt" "$RUNNER_TEMP/consumer-names.txt" | comm -23 - "$RUNNER_TEMP/pinned.txt" > "$RUNNER_TEMP/held.txt"
          if [ -s "$RUNNER_TEMP/held.txt" ]; then
            echo "::error::Held back below the newest compatible release: $(paste -sd ' ' "$RUNNER_TEMP/held.txt"). cargo tree --invert <name> shows which requirement holds each one back."
            exit 1
          fi
