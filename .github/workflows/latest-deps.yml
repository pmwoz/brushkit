name: Latest dependencies
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
jobs:
  test-latest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo update
      - uses: ./.github/actions/rust-cache
      - uses: ./.github/actions/single-copy
      - run: cargo test --workspace
      - run: cargo build --workspace --target wasm32-unknown-unknown
      - name: The crates build from a consumer crate without a lockfile
        env: { CARGO_TARGET_DIR: "${{ github.workspace }}/target" }
        run: |
          cargo new --lib --vcs none --edition 2021 "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          cargo add --path "$GITHUB_WORKSPACE/crates/brushkit" --features serde
          cargo build
      - name: The tests ran on the versions a consumer resolves
        run: |
          cargo tree -e normal -p brushkit -F brushkit/serde --prefix none --no-dedupe -f '{p}' | sort -u > "$RUNNER_TEMP/workspace.txt"
          cd "$RUNNER_TEMP/consumer"
          cargo tree -e normal --prefix none --no-dedupe -f '{p}' | grep -v '^consumer ' | sort -u > "$RUNNER_TEMP/consumer.txt"
          diff "$RUNNER_TEMP/workspace.txt" "$RUNNER_TEMP/consumer.txt"
      - name: No workspace pin holds back an unpinned dependency
        shell: bash
        run: |
          cd "$RUNNER_TEMP/consumer"
          cargo tree -e normal --prefix none -f '{p}' | cut -d ' ' -f 1 | sort -u > "$RUNNER_TEMP/tree.txt"
          cargo metadata --format-version 1 | jq -r '.packages[] | select(.source == null) | .dependencies[] | select(.kind == null and (.req | test("(^|,) *[=~<]"))) | .name' | sort -u | comm -12 - "$RUNNER_TEMP/tree.txt" > "$RUNNER_TEMP/pinned.txt"
          cargo update --dry-run --verbose --color never 2>&1 | tee "$RUNNER_TEMP/update.txt"
          sed -n 's/^ *Unchanged \([^ ]*\) v[^ ]* (available: v.*)$/\1/p' "$RUNNER_TEMP/update.txt" > "$RUNNER_TEMP/behind.txt"
          if [ "$(grep -c 'available:' "$RUNNER_TEMP/update.txt")" -ne "$(wc -l < "$RUNNER_TEMP/behind.txt")" ]; then
            echo "::error::Some cargo update lines with available: did not match the Unchanged pattern."
            exit 1
          fi
          : > "$RUNNER_TEMP/inverted.txt"
          while read -r pin; do
            cargo tree -e normal --prefix none -f '{p}' --invert "$pin" >> "$RUNNER_TEMP/inverted.txt" || { echo "::error::cargo tree --invert $pin failed. The workspace pin on $pin must resolve to one version in the consumer tree."; exit 1; }
          done < "$RUNNER_TEMP/pinned.txt"
          cut -d ' ' -f 1 "$RUNNER_TEMP/inverted.txt" | sort -u > "$RUNNER_TEMP/dependents.txt"
          sort -u "$RUNNER_TEMP/behind.txt" | comm -12 - "$RUNNER_TEMP/dependents.txt" | comm -23 - "$RUNNER_TEMP/pinned.txt" > "$RUNNER_TEMP/held.txt"
          if [ -s "$RUNNER_TEMP/held.txt" ]; then
            echo "::error::A workspace pin holds back: $(paste -sd ' ' "$RUNNER_TEMP/held.txt"). cargo tree --invert <name> shows the path."
            exit 1
          fi
