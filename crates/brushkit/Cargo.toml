[package]
name = "brushkit"
description = "Readers and tip renderers for Photoshop .abr and Procreate .brush and .brushset files, as one dependency over brushkit-abr and brushkit-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
brushkit-abr.workspace = true
brushkit-preview = { workspace = true, default-features = false }

[features]
default = ["text"]
text = ["brushkit-preview/text"]   # contact-sheet labels
serde = ["brushkit-abr/serde"]
