[package]
name = "brushkit-preview"
description = "Tip bitmaps for .abr, .brush and .brushset files: sampled tips, synthesized computed tips, Procreate Shape.png and contact sheets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
brushkit-abr.workspace = true
zip.workspace = true
plist.workspace = true
image.workspace = true
png.workspace = true
zune-jpeg.workspace = true
zune-core.workspace = true
ab_glyph = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests are their own crates, so the zip and plist builders they
# use to construct inputs need their own dependency edges.
plist.workspace = true
zip.workspace = true
# Inflates a fixture PNG's IDAT to check its row filters.
flate2.workspace = true
# The tests encode JPEG fixtures and compare zune-jpeg with image's decoder.
# BMP tests the path through `image`'s own decoders.
image = { workspace = true, features = ["jpeg", "bmp"] }

[features]
default = ["text"]
text = ["dep:ab_glyph"]   # the contact-sheet API; labels need a font
