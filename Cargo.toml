[workspace]
resolver = "2"
members = ["crates/abr", "crates/preview", "crates/fixture"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pmwoz/brushkit"

[workspace.dependencies]
thiserror = "2"
byteorder = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
plist = { version = "~1.8", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] } # tilde pin: the streaming API is unstable across plist minor bumps
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
png = "0.17"
