[workspace]
resolver = "2"
members = ["crates/brushkit", "crates/abr", "crates/preview", "crates/fixture"]
exclude = ["fuzz"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/pmwoz/brushkit"
readme = "README.md"

[workspace.dependencies]
brushkit-abr = { path = "crates/abr", version = "0.3.1" }
brushkit-preview = { path = "crates/preview", version = "0.3.1", default-features = false }
thiserror = "=2.0.12"
byteorder = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
plist = { version = "~1.8", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] } # tilde pin: the streaming API is unstable across plist minor bumps
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
# The tests compare `decode_png` with image's PNG decoder, so `png` must
# resolve to the copy `image` uses, which CI checks. Exact pin: the eXIf limit
# in `decode_png` and the eXIf sentence of `TipImageError::TooLarge` in
# `crates/preview/src/bitmap.rs` follow 0.18.1's chunk buffer and its copy in
# `Info`. That doc's decoder buffer sentence follows its unfiltering buffer.
# Recheck them before a bump.
png = "=0.18.1"
# Decodes a JPEG the way `image` 0.25 does, without its copy of the input. The
# tests compare it with image's JPEG decoder, so it must resolve to the copy
# `image` uses, which CI checks. Exact pin: the coefficient budget, the first
# scan header's end, read from the cursor after `decode_headers`, the metadata
# identifier peeks that `HideMetadata` changes, each right after the segment's
# length field and each identifier length peeked by one parser only, and the
# JPEG metadata sentence of `TipImageError::TooLarge` follow 0.5.15's
# internals, so recheck them in `crates/preview/src/bitmap.rs` before a bump.
zune-jpeg = "=0.5.15"
# `HideMetadata` implements zune-jpeg's reader trait, which in 0.5.1 has two
# more required methods.
zune-core = "0.5.3"
